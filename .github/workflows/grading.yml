name: C 프로그래밍 기말고사 (실습 통합 채점)

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 통합 채점 스크립트 실행 (100점 만점)
        id: grading
        run: |
          # ANSI 색상 코드 정의
          GREEN='\033[32m'
          RED='\033[31m'
          BLUE='\033[34m'
          NC='\033[0m' # No Color

          # ----------------------------------------------------
          # 1. 초기 변수 설정
          # ----------------------------------------------------
          P1_SCORE=0
          P2_SCORE=0
          P1_FEEDBACK=""
          P2_FEEDBACK=""
          FINAL_SCORE=0

          # Normalize function: Remove all whitespace (spaces, tabs, newlines, carriage returns)
          normalize_output() {
            tr -d ' \t\n\r' < "$1"
          }

          # ----------------------------------------------------
          # 2. 문제 1 채점 (3x3 배열 & 포인터 출력/대각선 합 - main-1.c) - 50점
          # ----------------------------------------------------
          echo -e "\n${BLUE}--- [TEST P1] 실습 1 채점 시작 (main-1.c) ---${NC}"

          # 2-1. 컴파일 시도
          if gcc main-1.c -o main1 2> compile_error_p1.txt; then
            echo -e "${GREEN}[OK]${NC} 문제 1: 컴파일 성공."

            # 2-2. 예상 출력 파일 생성
            {
              printf "  1  2  3\n"
              printf "  4  5  6\n"
              printf "  7  8  9\n"
              printf "=========\n"
              printf "대각선 합계: 15\n"
            } > expected_p1.txt

            # 2-3. 실행 및 원본 출력 캡처
            ./main1 > actual_p1_raw.txt

            # 2-4. 실제 출력 전체를 비교 대상으로 사용
            cp actual_p1_raw.txt actual_p1.txt

            # 2-5. 공백 제거 후 비교
            if [[ "$(normalize_output actual_p1.txt)" == "$(normalize_output expected_p1.txt)" ]]; then
              P1_SCORE=50
              P1_FEEDBACK="${GREEN}[OK]${NC} 문제 1 (3x3 배열 & 포인터 / 대각선 합): 통과 (50점)"
            else
              P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (3x3 배열 & 포인터 / 대각선 합): 실패."
              P1_FEEDBACK="${P1_FEEDBACK}\n  [학생 출력]: $(cat actual_p1.txt | tr '\n' ' ')"
              P1_FEEDBACK="${P1_FEEDBACK}\n  [예상 출력]: $(cat expected_p1.txt | tr '\n' ' ')"
            fi
          else
            echo -e "${RED}[FAIL]${NC} 문제 1: 컴파일 실패."
            P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (3x3 배열 & 포인터 / 대각선 합): 컴파일 실패. 코드를 확인하세요."
          fi

                    # ----------------------------------------------------
          # 3. 문제 2 채점 (파일 I/O + 포인터 + 비트 마스크 - main-2.c) - 50점
          # ----------------------------------------------------
          echo -e "\n${BLUE}--- [TEST P2] 실습 2 채점 시작 (main-2.c) ---${NC}"

          # 3-1. 컴파일 시도
          if gcc main-2.c -o main2 2> compile_error_p2.txt; then
            echo -e "${GREEN}[OK]${NC} 문제 2: 컴파일 성공."

            # 3-2. 입력 파일(source.txt) 생성
            #      학생 코드는 이 파일에서 3개의 값을 읽어야 함
            printf "0x27dc 0x5af1 0x603f\n" > source.txt

            # 3-3. 프로그램 실행 (result.txt 생성 기대)
            ./main2 > actual_p2_raw.txt 2> runtime_error_p2.txt

            # 3-4. result.txt 존재 여부 확인
            if [ ! -f "result.txt" ]; then
              P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (파일 비트 조작): 결과 파일(result.txt)이 생성되지 않았습니다."
            else
              # 3-5. result.txt에서 16진수 3개만 추출하여 비교
              #      기대 값: 0x17dc 0x4af1 0x503f
              EXPECTED_HEX="0x17dc 0x4af1 0x503f"

              # result.txt에서 '0x'로 시작하는 토큰을 3개 추출
              ACTUAL_HEX=$(grep -o '0x[0-9a-fA-F]\+' result.txt | head -n 3 | tr '\n' ' ')
              ACTUAL_HEX=$(echo "$ACTUAL_HEX" | sed 's/[[:space:]]\+$//')

              if [ "$ACTUAL_HEX" = "$EXPECTED_HEX" ]; then
                P2_SCORE=50
                P2_FEEDBACK="${GREEN}[OK]${NC} 문제 2 (파일 비트 조작): 통과 (50점)"
              else
                P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (파일 비트 조작): 실패."
                P2_FEEDBACK="${P2_FEEDBACK}\n  [학생 result.txt 내 숫자 3개]: $ACTUAL_HEX"
                P2_FEEDBACK="${P2_FEEDBACK}\n  [기대하는 숫자 3개]: $EXPECTED_HEX"
              fi
            fi
          else
            echo -e "${RED}[FAIL]${NC} 문제 2: 컴파일 실패."
            P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (파일 비트 조작): 컴파일 실패. 코드를 확인하세요."
          fi


          # ----------------------------------------------------
          # 4. 최종 점수 및 피드백 계산
          # ----------------------------------------------------
          FINAL_SCORE=$((P1_SCORE + P2_SCORE))

          FULL_FEEDBACK="--- 최종 채점 결과 (총 ${FINAL_SCORE}점 / 100점) ---\n"
          FULL_FEEDBACK="${FULL_FEEDBACK}\n${P1_FEEDBACK}"
          FULL_FEEDBACK="${FULL_FEEDBACK}\n${P2_FEEDBACK}"

          # 5. GitHub Classroom 출력 (점수 및 피드백 전달)
          echo "점수: ${FINAL_SCORE} / 100"
          echo "피드백:\n"
          echo -e "$FULL_FEEDBACK"

          echo "score=$FINAL_SCORE" >> "$GITHUB_OUTPUT"
          echo "feedback<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$FULL_FEEDBACK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # 6. 최종 실패 보장 로직 (원하시면 조건 제거 가능)
          if [ "$FINAL_SCORE" -ne 100 ]; then
            echo "::error::[ERROR] 최종 점수가 100점이 아니므로 채점 실패 처리합니다."
            exit 1
          fi
