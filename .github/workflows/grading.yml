name: C 프로그래밍 기말고사 (구조체/포인터/makefile 채점)

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 통합 채점 스크립트 실행 (100점 만점)
        id: grading
        run: |
          # ANSI 색상 코드 정의
          GREEN='\033[32m'
          RED='\033[31m'
          BLUE='\033[34m'
          NC='\033[0m' # No Color

          # ----------------------------------------------------
          # 1. 초기 변수 설정
          # ----------------------------------------------------
          P1_SCORE=0
          P2_SCORE=0
          P1_FEEDBACK=""
          P2_FEEDBACK=""
          FINAL_SCORE=0

          # Normalize function: Remove all whitespace (spaces, tabs, newlines, carriage returns) for strict comparison.
          # 문제 1의 요구사항: 공백 무시
          normalize_output() {
            tr -d ' \t\n\r' < "$1"
          }
          
          # ----------------------------------------------------
          # 2. 문제 1 채점 (화면 출력 기반 - main-1.c) - 50점
          # (요구사항: 공백 무시하고 출력 결과 비교)
          # ----------------------------------------------------
          echo -e "\n${BLUE}--- [TEST P1] 문제 1 채점 시작 (main-1.c) ---${NC}"

          # 2-1. 컴파일 시도
          if gcc main-1.c -o main1 2> compile_error_p1.txt; then
            echo -e "${GREEN}[OK]${NC} 문제 1: 컴파일 성공."
            
            # 2-2. 예상 출력 파일 생성 (예상 출력: "Hello World, Structs, Pointers!")
            printf "Hello World, Structs, Pointers!\n" > expected_p1.txt
            
            # 2-3. 실행 및 출력 캡처
            ./main1 > actual_p1.txt
            
            # 2-4. 출력 비교 (공백 무시)
            if [[ "$(normalize_output actual_p1.txt)" == "$(normalize_output expected_p1.txt)" ]]; then
              P1_SCORE=50
              P1_FEEDBACK="${GREEN}[OK]${NC} 문제 1 (화면 출력): 통과 (50점)"
            else
              P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (화면 출력): 실패."
              P1_FEEDBACK="${P1_FEEDBACK}\n  [학생 출력]: $(cat actual_p1.txt | tr '\n' ' ')"
              P1_FEEDBACK="${P1_FEEDBACK}\n  [예상 출력]: (공백 무시하고 비교)"
            fi
          else
            echo -e "${RED}[FAIL]${NC} 문제 1: 컴파일 실패."
            P1_FEEDBACK="${RED}[FAIL]${NC} 문제 1 (화면 출력): 컴파일 실패. 코드를 확인하세요."
          fi
          
          # ----------------------------------------------------
          # 3. 문제 2 채점 (파일 출력 기반 - main-2.c) - 50점
          # (요구사항: result.txt 파일의 첫 세 숫자만 비교)
          # ----------------------------------------------------
          echo -e "\n${BLUE}--- [TEST P2] 문제 2 채점 시작 (main-2.c) ---${NC}"

          # 3-1. 컴파일 시도
          if gcc main-2.c -o main2 2> compile_error_p2.txt; then
            echo -e "${GREEN}[OK]${NC} 문제 2: 컴파일 성공."

            # 3-2. 실행: result.txt 파일이 생성되도록 실행 (입력 없이 실행 가정)
            ./main2

            # 3-3. 예상 결과 정의 (첫 세 숫자가 500, 100, 20이라고 가정)
            EXPECTED_NUMBERS="500 100 20"

            # 3-4. result.txt 파일에서 첫 세 숫자만 추출 및 정규화
            if [ -f "result.txt" ]; then
                # awk를 사용하여 result.txt 파일 내용 중 첫 세 필드(숫자)만 추출
                # tr -d ' \t\n\r'로 추출된 결과에서 모든 공백 제거하여 엄격 비교 준비
                ACTUAL_EXTRACTED=$(awk '{print $1, $2, $3; exit}' result.txt | tr -d ' \t\n\r')
                EXPECTED_NORMALIZED=$(echo "$EXPECTED_NUMBERS" | tr -d ' \t\n\r')

                # 3-5. 추출된 숫자 비교
                if [[ "$ACTUAL_EXTRACTED" == "$EXPECTED_NORMALIZED" ]]; then
                    P2_SCORE=50
                    P2_FEEDBACK="${GREEN}[OK]${NC} 문제 2 (파일 출력): 통과 (50점)"
                else
                    P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (파일 출력): 실패. (result.txt의 첫 세 숫자 불일치)"
                    P2_FEEDBACK="${P2_FEEDBACK}\n  [파일 내용]: $(cat result.txt | tr '\n' ' ')"
                    P2_FEEDBACK="${P2_FEEDBACK}\n  [추출 결과]: $ACTUAL_EXTRACTED"
                    P2_FEEDBACK="${P2_FEEDBACK}\n  [예상 결과]: $EXPECTED_NORMALIZED"
                fi
            else
                P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (파일 출력): result.txt 파일이 생성되지 않았습니다."
            fi
          else
            echo -e "${RED}[FAIL]${NC} 문제 2: 컴파일 실패."
            P2_FEEDBACK="${RED}[FAIL]${NC} 문제 2 (파일 출력): 컴파일 실패. 코드를 확인하세요."
          fi

          # ----------------------------------------------------
          # 4. 최종 점수 및 피드백 계산
          # ----------------------------------------------------
          FINAL_SCORE=$((P1_SCORE + P2_SCORE))
          
          # 최종 피드백 구성 (헤더 + P1 결과 + P2 결과)
          FULL_FEEDBACK="--- 최종 채점 결과 (총 ${FINAL_SCORE}점 / 100점) ---\n"
          FULL_FEEDBACK="${FULL_FEEDBACK}\n${P1_FEEDBACK}"
          FULL_FEEDBACK="${FULL_FEEDBACK}\n${P2_FEEDBACK}"
          
          # 5. GitHub Classroom 출력 (점수 및 피드백 전달)
          echo "점수: ${FINAL_SCORE} / 100"
          echo "피드백:\n"
          echo -e "$FULL_FEEDBACK"

          echo "score=$FINAL_SCORE" >> "$GITHUB_OUTPUT"
          echo "feedback<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$FULL_FEEDBACK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # 6. 최종 실패 보장 로직
          if [ $FINAL_SCORE -ne 100 ]; then
            echo "::error::[ERROR] 최종 점수가 100점이 아니므로 채점 실패 처리합니다."
            exit 1
          fi
